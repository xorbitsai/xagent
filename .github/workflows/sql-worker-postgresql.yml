name: SQL Worker PostgreSQL

on:
  pull_request:
    paths:
      - 'src/xagent/core/tools/core/sql_*.py'
      - 'src/xagent/sql_worker.py'
      - 'src/xagent/config.py'
      - 'tests/core/tools/core/test_sql_*.py'
      - 'tests/shared/postgres_disposable.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/sql-worker-postgresql.yml'
  push:
    branches: [main]
    paths:
      - 'src/xagent/core/tools/core/sql_*.py'
      - 'src/xagent/sql_worker.py'
      - 'src/xagent/config.py'
      - 'tests/core/tools/core/test_sql_*.py'
      - 'tests/shared/postgres_disposable.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/sql-worker-postgresql.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: xagent
          POSTGRES_PASSWORD: xagent_test
          POSTGRES_DB: xagent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xagent -d xagent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked test dependencies
        run: |
          python -m pip install uv
          uv sync --frozen --group test
      - name: Run PostgreSQL worker regressions
        env:
          PYTHON_DOTENV_DISABLED: '1'
          XAGENT_TEST_POSTGRES_URL: postgresql://xagent:xagent_test@localhost:5432/xagent_test
        run: uv run --frozen pytest tests/core/tools/core/test_sql_worker_postgresql.py -m postgresql -v
