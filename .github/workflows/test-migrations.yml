name: Test Database Migrations

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Direct dependencies of the jobs below, not a transitive closure. A
    # module reached only through another module on this list is not here,
    # and adding one is a deliberate act -- the two lists are maintained by
    # hand and must stay line-for-line mirrors of each other.
    paths:
      - 'src/xagent/migrations/**'
      - 'tests/migrations/**'
      - 'tests/alembic/**'
      - '.github/workflows/test-migrations.yml'
      - 'src/xagent/db/**'
      - 'src/xagent/web/services/gmail_provisioning.py'
      - 'tests/web/services/test_gmail_provisioning.py'
      - 'src/xagent/web/services/agent_management.py'
      - 'src/xagent/web/services/api_keys.py'
      - 'tests/web/services/test_runtime_key_transition_postgres.py'
      - 'src/xagent/web/services/task_command_transport.py'
      - 'tests/web/services/test_task_command_transport.py'
      - 'src/xagent/web/models/task.py'
      - 'tests/web/services/task_status_storage_shared.py'
      - 'tests/web/services/test_task_status_storage_postgresql.py'
      - 'src/xagent/web/api/monitor.py'
      - 'tests/web/api/test_monitor_postgresql.py'
      - 'tests/web/api/monitor_daily_window_shared.py'
      - 'src/xagent/web/services/task_interaction_staging.py'
      - 'tests/web/services/test_interaction_staging_postgresql.py'
      - 'src/xagent/web/services/task_interaction_service.py'
      - 'tests/web/services/test_task_interaction_service_postgresql.py'
      - 'tests/web/services/task_interaction_schema_shared.py'
      - 'src/xagent/web/models/task_interaction.py'
      - 'src/xagent/web/services/task_interaction_schema.py'
      - 'src/xagent/core/agent/checkpoint.py'
      - 'src/xagent/web/services/task_lease_service.py'
      - 'src/xagent/web/services/chat_history_service.py'
      - 'src/xagent/web/services/ops_signals.py'
      - 'src/xagent/core/tools/adapters/vibe/ask_user_tool.py'
      - 'src/xagent/web/models/database.py'
      - 'src/xagent/web/services/task_interaction_close.py'
      - 'tests/web/services/test_supersede_savepoint_postgresql.py'
      - 'tests/web/services/test_task_interaction_close_postgresql.py'
      - 'src/xagent/web/models/chat_message.py'
      - 'src/xagent/web/models/user.py'
      - 'src/xagent/web/models/user_oauth.py'
      - 'tests/web/test_user_oauth_actor_ownership.py'
      - 'tests/shared/postgres_disposable.py'
      - 'tests/web/services/checkpoint_anchor_shared.py'
  pull_request:
    branches: [main]
  # Required by the merge queue: without this the two required contexts below
  # are never reported on a merge group, its entries time out, and every merge
  # stalls. Harmless before a queue exists -- merge_group simply never fires.
  merge_group:

env:
  # Same version docker/Dockerfile.backend and docker/Dockerfile.sandbox pin.
  # Declared once here so the two install steps below cannot drift apart.
  UV_VERSION: "0.11.10"

jobs:
  detect-migration-changes:
    name: Detect migration changes
    runs-on: ubuntu-latest
    outputs:
      should-test: ${{ steps.changes.outputs.should-test }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          # Note: this is deliberately a two-dot diff (base tip vs head), not
          # merge-base vs head. It over-triggers once main moves past a
          # migration, and that over-triggering is load-bearing today -- it is
          # what catches a migration that landed on main but is absent from
          # this branch. Do not "fix" it to merge-base while that matters.
          #
          # Line-for-line mirror of on.push.paths above; same scope caveat
          # (direct dependencies, not a transitive closure). Changing one
          # list without the other silently disables half the trigger.
          RELEVANT_PATHS=(
            src/xagent/migrations
            tests/migrations
            tests/alembic
            .github/workflows/test-migrations.yml
            src/xagent/db
            src/xagent/web/services/gmail_provisioning.py
            tests/web/services/test_gmail_provisioning.py
            src/xagent/web/services/agent_management.py
            src/xagent/web/services/api_keys.py
            tests/web/services/test_runtime_key_transition_postgres.py
            src/xagent/web/services/task_command_transport.py
            tests/web/services/test_task_command_transport.py
            src/xagent/web/models/task.py
            tests/web/services/task_status_storage_shared.py
            tests/web/services/test_task_status_storage_postgresql.py
            src/xagent/web/api/monitor.py
            tests/web/api/test_monitor_postgresql.py
            tests/web/api/monitor_daily_window_shared.py
            src/xagent/web/services/task_interaction_staging.py
            tests/web/services/test_interaction_staging_postgresql.py
            src/xagent/web/services/task_interaction_service.py
            tests/web/services/test_task_interaction_service_postgresql.py
            tests/web/services/task_interaction_schema_shared.py
            src/xagent/web/models/task_interaction.py
            src/xagent/web/services/task_interaction_schema.py
            src/xagent/core/agent/checkpoint.py
            src/xagent/web/services/task_lease_service.py
            src/xagent/web/services/chat_history_service.py
            src/xagent/web/services/ops_signals.py
            src/xagent/core/tools/adapters/vibe/ask_user_tool.py
            src/xagent/web/models/database.py
            src/xagent/web/services/task_interaction_close.py
            tests/web/services/test_supersede_savepoint_postgresql.py
            tests/web/services/test_task_interaction_close_postgresql.py
            src/xagent/web/models/chat_message.py
            src/xagent/web/models/user.py
            src/xagent/web/models/user_oauth.py
            tests/web/test_user_oauth_actor_ownership.py
            tests/shared/postgres_disposable.py
            tests/web/services/checkpoint_anchor_shared.py
          )

          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE_SHA"
              head="$PR_HEAD_SHA"
              ;;
            merge_group)
              # The merge group branch contains main plus every entry ahead of
              # this one plus this PR, so this diff covers the whole group.
              base="$MERGE_GROUP_BASE_SHA"
              head="$MERGE_GROUP_HEAD_SHA"
              ;;
            *)
              echo "should-test=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          if git diff --quiet "$base" "$head" -- "${RELEVANT_PATHS[@]}"; then
            echo "should-test=false" >> "$GITHUB_OUTPUT"
          else
            echo "should-test=true" >> "$GITHUB_OUTPUT"
          fi

  test-sqlite-migrations:
    name: Test SQLite Migrations
    needs: detect-migration-changes
    runs-on: ubuntu-latest

    steps:
      - name: Skip migration tests
        if: needs.detect-migration-changes.outputs.should-test != 'true'
        run: echo "No migration-related changes detected."

      - name: Checkout code
        if: needs.detect-migration-changes.outputs.should-test == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: needs.detect-migration-changes.outputs.should-test == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: needs.detect-migration-changes.outputs.should-test == 'true'
        run: |
          # Install from uv.lock, the same resolution every other job uses.
          # A plain "pip install -e .[all]" re-resolves the whole graph from
          # PyPI on every run, so an upper bound added anywhere in pyproject
          # -- or any upstream release -- can make the resolver backtrack
          # until it gives up, turning this workflow red on changes that have
          # nothing to do with it. Putting the environment on PATH keeps the
          # test steps below unchanged and leaves no call site able to fall
          # back to the system interpreter.
          #
          # --locked is what turns that into a guarantee. A bare "uv sync"
          # rewrites uv.lock as soon as project metadata has drifted from it,
          # which puts the independent resolution straight back; --locked
          # fails the job instead and names the stale lock.
          #
          # Pinning uv is the other half of that guarantee: a floating uv can
          # ship a lock-format change that makes --locked fail on uv's release
          # schedule rather than on anything in this repository.
          #
          # Only the test group is installed. The dev group adds pre-commit,
          # ruff, flake8, mypy and the type stubs, and no step in either
          # migration job runs any of them. alembic comes from the project
          # dependencies and pytest from the test group, so both jobs still
          # have everything they invoke.
          python -m pip install "uv==${UV_VERSION}"
          uv sync --locked --all-extras --no-default-groups --group test
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Test migration upgrade
        if: needs.detect-migration-changes.outputs.should-test == 'true'
        run: |
          python tests/migrations/test_migration_integration.py --db sqlite upgrade

      - name: Test migration idempotence
        if: needs.detect-migration-changes.outputs.should-test == 'true'
        run: |
          python tests/migrations/test_migration_integration.py --db sqlite idempotence

      - name: Test incremental upgrades
        if: needs.detect-migration-changes.outputs.should-test == 'true'
        run: |
          python tests/migrations/test_migration_integration.py --db sqlite incremental

      - name: Test migration downgrade
        if: needs.detect-migration-changes.outputs.should-test == 'true'
        run: |
          python tests/migrations/test_migration_integration.py --db sqlite downgrade

  test-postgresql-migrations:
    name: Test PostgreSQL Migrations
    needs: detect-migration-changes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: xagent
          POSTGRES_PASSWORD: xagent
          POSTGRES_DB: xagent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Skip migration tests
        if: needs.detect-migration-changes.outputs.should-test != 'true'
        run: echo "No migration-related changes detected."

      - name: Checkout code
        if: needs.detect-migration-changes.outputs.should-test == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: needs.detect-migration-changes.outputs.should-test == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: needs.detect-migration-changes.outputs.should-test == 'true'
        run: |
          # Install from uv.lock, the same resolution every other job uses.
          # A plain "pip install -e .[all]" re-resolves the whole graph from
          # PyPI on every run, so an upper bound added anywhere in pyproject
          # -- or any upstream release -- can make the resolver backtrack
          # until it gives up, turning this workflow red on changes that have
          # nothing to do with it. Putting the environment on PATH keeps the
          # test steps below unchanged and leaves no call site able to fall
          # back to the system interpreter.
          #
          # --locked is what turns that into a guarantee. A bare "uv sync"
          # rewrites uv.lock as soon as project metadata has drifted from it,
          # which puts the independent resolution straight back; --locked
          # fails the job instead and names the stale lock.
          #
          # Pinning uv is the other half of that guarantee: a floating uv can
          # ship a lock-format change that makes --locked fail on uv's release
          # schedule rather than on anything in this repository.
          #
          # Only the test group is installed. The dev group adds pre-commit,
          # ruff, flake8, mypy and the type stubs, and no step in either
          # migration job runs any of them. alembic comes from the project
          # dependencies and pytest from the test group, so both jobs still
          # have everything they invoke.
          python -m pip install "uv==${UV_VERSION}"
          uv sync --locked --all-extras --no-default-groups --group test
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Test migration upgrade
        if: needs.detect-migration-changes.outputs.should-test == 'true'
        run: |
          python tests/migrations/test_migration_integration.py --db postgresql upgrade
        env:
          DATABASE_URL: postgresql://xagent:xagent@localhost:5432/xagent_test

      - name: Test migration idempotence
        if: needs.detect-migration-changes.outputs.should-test == 'true'
        run: |
          python tests/migrations/test_migration_integration.py --db postgresql idempotence
        env:
          DATABASE_URL: postgresql://xagent:xagent@localhost:5432/xagent_test

      - name: Test incremental upgrades
        if: needs.detect-migration-changes.outputs.should-test == 'true'
        run: |
          python tests/migrations/test_migration_integration.py --db postgresql incremental
        env:
          DATABASE_URL: postgresql://xagent:xagent@localhost:5432/xagent_test

      - name: Test migration downgrade
        if: needs.detect-migration-changes.outputs.should-test == 'true'
        run: |
          python tests/migrations/test_migration_integration.py --db postgresql downgrade
        env:
          DATABASE_URL: postgresql://xagent:xagent@localhost:5432/xagent_test

      # Any new migration test file with postgresql-marked tests must be
      # added to this list -- the fast job deselects the marker and
      # provisions no database, so an unlisted file's postgres tests run
      # nowhere.
      - name: Test owner-aware OAuth migrations (Postgres-only)
        if: needs.detect-migration-changes.outputs.should-test == 'true'
        run: |
          pytest tests/migrations/test_migration_integration.py -m postgresql -q
        env:
          DATABASE_URL: postgresql://xagent:xagent@localhost:5432/xagent_test

      - name: Test Gmail provisioning Postgres-only behavior
        if: needs.detect-migration-changes.outputs.should-test == 'true'
        run: |
          pytest tests/web/services/test_gmail_provisioning.py -m postgresql -q
        env:
          XAGENT_TEST_POSTGRES_URL: postgresql://xagent:xagent@localhost:5432/xagent_test

      - name: Test runtime-key transition fencing (Postgres-only)
        if: needs.detect-migration-changes.outputs.should-test == 'true'
        run: |
          pytest tests/web/services/test_runtime_key_transition_postgres.py -q
        env:
          XAGENT_TEST_POSTGRES_URL: postgresql://xagent:xagent@localhost:5432/xagent_test

      - name: Test task command staging concurrency (Postgres-only)
        if: needs.detect-migration-changes.outputs.should-test == 'true'
        run: |
          pytest tests/web/services/test_task_command_transport.py -m postgresql -q
        env:
          XAGENT_TEST_POSTGRES_URL: postgresql://xagent:xagent@localhost:5432/xagent_test

      - name: Test task status storage semantics (Postgres-only)
        if: needs.detect-migration-changes.outputs.should-test == 'true'
        run: |
          pytest tests/web/services/test_task_status_storage_postgresql.py -q
        env:
          XAGENT_TEST_POSTGRES_URL: postgresql://xagent:xagent@localhost:5432/xagent_test

      - name: Test task_interaction_requests migration (Postgres-only)
        if: needs.detect-migration-changes.outputs.should-test == 'true'
        run: |
          pytest tests/alembic/test_20260809_add_task_interaction_requests.py -m postgresql -q
        env:
          XAGENT_TEST_POSTGRES_URL: postgresql://xagent:xagent@localhost:5432/xagent_test

      - name: Test task_interaction_requests create_all/migration parity (Postgres-only)
        if: needs.detect-migration-changes.outputs.should-test == 'true'
        run: |
          pytest tests/migrations/test_task_interaction_requests_schema_parity.py -m postgresql -q
        env:
          XAGENT_TEST_POSTGRES_URL: postgresql://xagent:xagent@localhost:5432/xagent_test

      - name: Test monitoring JSON extraction (Postgres-only)
        if: needs.detect-migration-changes.outputs.should-test == 'true'
        run: |
          pytest tests/web/api/test_monitor_postgresql.py -m postgresql -q
        env:
          XAGENT_TEST_POSTGRES_URL: postgresql://xagent:xagent@localhost:5432/xagent_test

      - name: Test interaction staging primitives (Postgres-only)
        if: needs.detect-migration-changes.outputs.should-test == 'true'
        run: |
          pytest tests/web/services/test_interaction_staging_postgresql.py -m postgresql -q
        env:
          XAGENT_TEST_POSTGRES_URL: postgresql://xagent:xagent@localhost:5432/xagent_test

      - name: Test task_interaction_protocol_version migration (Postgres-only)
        if: needs.detect-migration-changes.outputs.should-test == 'true'
        run: |
          pytest tests/alembic/test_20260810_add_task_interaction_protocol_version.py -m postgresql -q
        env:
          XAGENT_TEST_POSTGRES_URL: postgresql://xagent:xagent@localhost:5432/xagent_test

      - name: Test task_interaction_protocol_version create_all/migration parity (Postgres-only)
        if: needs.detect-migration-changes.outputs.should-test == 'true'
        run: |
          pytest tests/migrations/test_task_interaction_protocol_version_parity.py -m postgresql -q
        env:
          XAGENT_TEST_POSTGRES_URL: postgresql://xagent:xagent@localhost:5432/xagent_test

      - name: Test interaction lifecycle service compatibility view (Postgres-only)
        if: needs.detect-migration-changes.outputs.should-test == 'true'
        run: |
          pytest tests/web/services/test_task_interaction_service_postgresql.py -m postgresql -q
        env:
          XAGENT_TEST_POSTGRES_URL: postgresql://xagent:xagent@localhost:5432/xagent_test

      # The json -> jsonb conversion and its row cleanup only exist on
      # PostgreSQL; the SQLite half of this file pins a no-op and runs in the
      # ordinary suite.
      - name: Test trace payload json to jsonb migration (Postgres-only)
        if: needs.detect-migration-changes.outputs.should-test == 'true'
        run: |
          pytest tests/migrations/test_20260813_trace_json_columns_to_jsonb.py -m postgresql -q
        env:
          XAGENT_TEST_POSTGRES_URL: postgresql://xagent:xagent@localhost:5432/xagent_test

      - name: Test legacy resume interaction close rowcount grid (Postgres-only)
        if: needs.detect-migration-changes.outputs.should-test == 'true'
        run: |
          pytest tests/web/services/test_task_interaction_close_postgresql.py -m postgresql -q
        env:
          XAGENT_TEST_POSTGRES_URL: postgresql://xagent:xagent@localhost:5432/xagent_test

      # This step's fixture creates and drops its own disposable schema (see
      # test_supersede_savepoint_postgresql.py), so it has no ordering
      # dependency on the other steps in this job.
      - name: Test legacy-question supersede savepoint isolation (Postgres-only)
        if: needs.detect-migration-changes.outputs.should-test == 'true'
        run: |
          pytest tests/web/services/test_supersede_savepoint_postgresql.py -m postgresql -q
        env:
          XAGENT_TEST_POSTGRES_URL: postgresql://xagent:xagent@localhost:5432/xagent_test

  migrations-summary:
    name: Migrations Summary
    runs-on: ubuntu-latest
    # always() is what makes this fail-closed. Without it a failure in
    # detect-migration-changes would skip this job too, and a *skipped* required
    # check is reported to branch protection as a success -- so the merge would
    # go through with neither migration job having run. The individual job names
    # cannot be required contexts for the same reason; this one can, because it
    # always runs and turns every non-success into an explicit failure.
    if: always()
    needs:
      - detect-migration-changes
      - test-sqlite-migrations
      - test-postgresql-migrations

    steps:
      - name: Check required jobs
        shell: bash
        env:
          DETECT_RESULT: ${{ needs.detect-migration-changes.result }}
          SQLITE_RESULT: ${{ needs.test-sqlite-migrations.result }}
          POSTGRESQL_RESULT: ${{ needs.test-postgresql-migrations.result }}
        run: |
          set -uo pipefail

          failed=0
          check_job() {
            local name="$1"
            local result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::$name finished with result: $result"
              failed=1
            fi
          }

          check_job "detect-migration-changes" "$DETECT_RESULT"
          check_job "test-sqlite-migrations" "$SQLITE_RESULT"
          check_job "test-postgresql-migrations" "$POSTGRESQL_RESULT"

          exit "$failed"
