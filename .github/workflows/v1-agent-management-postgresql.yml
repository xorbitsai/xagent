name: V1 Agent Management PostgreSQL

on:
  pull_request:
    paths:
      - 'src/xagent/web/api/v1/agents.py'
      - 'src/xagent/web/api/v1/models.py'
      - 'src/xagent/web/schemas/v1.py'
      - 'src/xagent/web/services/agent_management.py'
      - 'src/xagent/web/services/model_service.py'
      - 'src/xagent/web/services/agent_store.py'
      - 'src/xagent/web/services/agent_team_scope.py'
      - 'src/xagent/web/models/agent.py'
      - 'src/xagent/web/models/user.py'
      - 'src/xagent/web/models/database.py'
      - 'src/xagent/core/model/storage/db/db_models.py'
      - 'tests/web/api/v1/test_agent_detail.py'
      - 'tests/web/api/v1/test_models_listing.py'
      - 'tests/web/api/v1/test_agent_update.py'
      - 'tests/conftest.py'
      - 'tests/web/conftest.py'
      - 'tests/shared/postgres_disposable.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/v1-agent-management-postgresql.yml'
  push:
    branches: [main]
    paths:
      - 'src/xagent/web/api/v1/agents.py'
      - 'src/xagent/web/api/v1/models.py'
      - 'src/xagent/web/schemas/v1.py'
      - 'src/xagent/web/services/agent_management.py'
      - 'src/xagent/web/services/model_service.py'
      - 'src/xagent/web/services/agent_store.py'
      - 'src/xagent/web/services/agent_team_scope.py'
      - 'src/xagent/web/models/agent.py'
      - 'src/xagent/web/models/user.py'
      - 'src/xagent/web/models/database.py'
      - 'src/xagent/core/model/storage/db/db_models.py'
      - 'tests/web/api/v1/test_agent_detail.py'
      - 'tests/web/api/v1/test_models_listing.py'
      - 'tests/web/api/v1/test_agent_update.py'
      - 'tests/conftest.py'
      - 'tests/web/conftest.py'
      - 'tests/shared/postgres_disposable.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/v1-agent-management-postgresql.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: xagent
          POSTGRES_PASSWORD: xagent_test
          POSTGRES_DB: xagent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xagent -d xagent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install locked test dependencies
        run: |
          python -m pip install uv
          uv sync --frozen --group test
      - name: Run PostgreSQL agent management regressions
        env:
          PYTHON_DOTENV_DISABLED: '1'
          XAGENT_TEST_POSTGRES_URL: postgresql://xagent:xagent_test@localhost:5432/xagent_test
        run: uv run --frozen pytest tests/web/api/v1/test_agent_detail.py -m postgresql -v
