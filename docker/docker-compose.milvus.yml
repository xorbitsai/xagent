services:
  backend:
    environment:
      - XAGENT_VECTOR_BACKEND=milvus
      - MILVUS_URI=http://milvus:19530
    depends_on:
      milvus:
        condition: service_healthy

  worker:
    environment:
      - XAGENT_VECTOR_BACKEND=milvus
      - MILVUS_URI=http://milvus:19530
    depends_on:
      milvus:
        condition: service_healthy

  scheduler:
    environment:
      - XAGENT_VECTOR_BACKEND=milvus
      - MILVUS_URI=http://milvus:19530

  # Milvus metadata store
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.25
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://milvus-etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - milvus_etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xagent_network

  # Milvus object storage. Not published: the default credentials are only
  # reachable from the Compose network.
  milvus-minio:
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    environment:
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - milvus_minio_data:/minio_data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xagent_network

  # Milvus standalone (knowledge-base engine); gRPC on 19530, not published
  milvus:
    image: milvusdb/milvus:v2.6.25
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      - ETCD_ENDPOINTS=milvus-etcd:2379
      - MINIO_ADDRESS=milvus-minio:9000
      - MQ_TYPE=woodpecker
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - xagent_network

volumes:
  milvus_etcd_data:
    driver: local
  milvus_minio_data:
    driver: local
  milvus_data:
    driver: local
