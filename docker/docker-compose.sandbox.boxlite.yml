services:
  backend:
    environment:
      - SANDBOX_ENABLED=true
      - SANDBOX_IMPLEMENTATION=boxlite
      - SANDBOX_IMAGE=xprobe/xagent-sandbox:0.8.0
      - SANDBOX_CPUS=1
      - SANDBOX_MEMORY=512
      - XAGENT_SANDBOX_WORKER_ID=backend
      - BOXLITE_HOME_DIR=/root/.xagent/boxlite
    privileged: true
    devices:
      - /dev/kvm:/dev/kvm

  worker:
    environment:
      - XAGENT_SANDBOX_WORKER_ID=celery-worker

  scheduler:
    environment:
      - XAGENT_SANDBOX_WORKER_ID=scheduler
