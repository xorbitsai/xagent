id: operations-devops-ai-agent
name: DevOps AI Agent
category: Operations
featured: false
descriptions:
  en: Monitors your AWS environment, triages alerts and incidents, runs read-only diagnostics over SSH where a target is configured, and posts findings plus a recommended fix to Slack for a human to action — it never makes changes itself.
  zh: 监控 AWS 环境，对告警与事件进行分诊，在已配置目标时通过 SSH 执行只读诊断，并将排查结果和修复建议发布到 Slack 供人工处理——该 Agent 本身不会执行任何变更操作。
features:
  en:
  - Wakes on an alert / webhook, a schedule, or a direct chat request
  - Investigates via CloudWatch, DynamoDB and SQS, plus read-only SSH diagnostics where a target is configured
  - Triages against a known-noise catalog and posts a root-cause hypothesis with a recommended fix to Slack
  zh:
  - 由告警 / webhook、定时任务或聊天请求触发
  - 通过 CloudWatch、DynamoDB、SQS 进行排查，并在已配置目标时执行只读 SSH 诊断
  - 对照已知噪声名录进行分诊，并将根因假设与修复建议发布到 Slack
sample_prompts:
  en:
  - title: Triage this incident now
    prompt: Pull the CloudWatch metrics and logs for the last hour, run read-only diagnostics on the affected hosts, and post a root-cause hypothesis with a recommended fix and severity to Slack.
    highlights:
    - CloudWatch metrics and logs
  - title: Check SQS and DynamoDB health
    prompt: Check the SQS queues and DynamoDB tables for this service for anomalies against the known-noise catalog, and report anything that doesn't match a known benign pattern.
    highlights:
    - SQS queues and DynamoDB tables
  zh:
  - title: 立即排查这次故障
    prompt: 拉取过去一小时的 CloudWatch 指标和日志，对受影响主机执行只读诊断，并将根因假设、修复建议和严重程度发布到 Slack。
    highlights:
    - CloudWatch 指标和日志
  - title: 检查 SQS 和 DynamoDB 状态
    prompt: 对照已知噪声名录检查该服务的 SQS 队列和 DynamoDB 表是否存在异常，并汇报不符合已知良性模式的情况。
    highlights:
    - SQS 队列和 DynamoDB 表
