    zh: DevOps 智能运维专员
  avatar: /marketplace/avatars/milo.png
  intro:
    en: |-
      Hi there — I'm Milo, your DevOps AI Agent.

      Paste logs or command output and I give you a timeline, a root cause and a fix.
    zh: |-
      你好，我是 Milo，你的 DevOps 智能运维专员。

      把日志或命令输出粘贴给我，我会给出时间线、根因分析和修复建议。
