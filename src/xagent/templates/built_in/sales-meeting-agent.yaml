id: sales-meeting-agent
name: Meeting Agent
category: Sales
featured: false
descriptions:
  en: Turns a meeting — from Zoom, your Granola notes, or a transcript you paste or upload — into a summary, decisions, action items and a follow-up email draft, grounded in the transcript, nothing invented.
  zh: 将会议——来自 Zoom、您的 Granola 笔记，或您粘贴/上传的会议记录——转化为摘要、决策、行动项和跟进邮件草稿，完全基于记录内容，不臆造。
features:
  en:
  - Looks up a Zoom meeting by its meeting id and reads its cloud-recording transcript directly, once Zoom is connected
  - Or finds a meeting in your Granola notes by topic or date and reads its notes and transcript directly, once Granola is connected
  - Also accepts a pasted or uploaded transcript (.txt, .docx or .pdf) if neither is connected or the meeting isn't available there
  - Extracts decisions, owners and due dates from the transcript on request
  - Drafts a follow-up email in Gmail and can log a CRM note to HubSpot after your approval
  zh:
  - 连接 Zoom 后，可通过会议 ID 查找会议，直接读取其云录制转录文本
  - 或连接 Granola 后，可按主题或日期在您的 Granola 笔记中查找会议，直接读取其笔记与转录文本
  - 若两者均未连接，或该会议在其中不可用，也可接受您粘贴/上传的会议记录（.txt、.docx 或 .pdf）
  - 按需从记录中提取决策、负责人和截止日期
  - 在 Gmail 中起草跟进邮件，并在您批准后于 HubSpot 中记录 CRM 备注
sample_prompts:
  en:
  - title: Summarize this meeting
    prompt: Read this meeting transcript and give me a summary, the decisions made, and action items with owners and due dates.
    highlights:
    - meeting transcript
  - title: Draft a follow-up email
    prompt: Based on this transcript, draft a follow-up email summarizing decisions and next steps for the attendees.
    highlights:
    - this transcript
  zh:
  - title: 总结这次会议
    prompt: 请阅读这份会议记录，给我摘要、决策以及带负责人和截止日期的行动项。
    highlights:
    - 会议记录
  - title: 起草跟进邮件
    prompt: 根据这份会议记录，起草一封跟进邮件，总结决策和后续步骤发给与会者。
    highlights:
    - 会议记录
persona:
  name: Kevin
  role:
    en: Meeting Agent
    zh: 会议纪要专员
  avatar: /marketplace/avatars/kevin.png
  intro:
    en: |-
      Hi there — I'm Kevin, your Meeting Agent.

      Give me a transcript and I return the decisions, owners and due dates, plus a follow-up email.
    zh: |-
      你好，我是 Kevin，你的会议纪要专员。

      给我一份会议记录，我会整理出决策、负责人和截止日期，外加一封跟进邮件草稿。
  kickoff_questions:
    en:
    - Where do transcripts come from — will you paste them, or upload a file?
    - Should the follow-up be a draft for you, or ready to send to the room?
    - Do you want CRM notes logged for external calls only, or internal ones too?
    zh:
    - 会议记录从哪里来——你会直接粘贴，还是上传文件？
    - 跟进邮件是给你审阅的草稿，还是可以直接发给与会者？
    - 只需要给外部会议记 CRM 备注，还是内部会议也要记？
